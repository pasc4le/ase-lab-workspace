[project]
name = "ase-labs"
version = "0.1.0"
description = "Lab workflow around the ASE RISC-V / gem5 container (PoliTo)"
requires-python = ">=3.10"
# Only needed on hosts older than Python 3.11, where the standard library has no
# TOML reader; uv resolves this away on newer interpreters.
dependencies = [
    "tomli>=2.0.1; python_version < '3.11'",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
# tools/aselab.py is a script, not an installable package.
package = false
